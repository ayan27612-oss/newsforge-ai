<script>

/* ============================================================
   NEWSFORGE AI
   FRONTEND ENGINE V1.2
   REAL AI RESEARCH INTEGRATION
============================================================ */

(function(){

  "use strict";


  /* ==========================================================
     STATE
  ========================================================== */

  let allArticles = [];

  let currentCategory = "ALL";

  let isDiscovering = false;

  let isResearchOpen = false;

  let isResearching = false;

  let selectedArticle = null;

  let contentGenerated = 0;


  /* ==========================================================
     HELPERS
  ========================================================== */

  function el(id){
    return document.getElementById(id);
  }


  function escapeHTML(value){

    if(value === null || value === undefined){
      return "";
    }

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function truncate(text,length){

    if(!text){
      return "";
    }

    text = String(text);

    if(text.length <= length){
      return text;
    }

    return text.substring(0,length).trim() + "...";

  }


  function showToast(title,text){

    const toast = el("toast");

    if(!toast){
      return;
    }

    el("toastTitle").textContent = title;

    el("toastText").textContent = text;

    toast.classList.add("show");

    clearTimeout(window.__newsforgeToast);

    window.__newsforgeToast = setTimeout(function(){

      toast.classList.remove("show");

    },4000);

  }


  function addActivity(text,type){

    const activity = el("activity");

    if(!activity){
      return;
    }


    const row = document.createElement("div");

    row.className = "activity-line";


    const time = new Date().toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });


    let dotColor = "#22c55e";

    if(type === "error"){
      dotColor = "#ef4444";
    }

    if(type === "warn"){
      dotColor = "#f59e0b";
    }

    if(type === "research"){
      dotColor = "#8b5cf6";
    }


    row.innerHTML = `
      <div class="activity-time">
        ${escapeHTML(time)}
      </div>

      <div
        class="activity-dot"
        style="background:${dotColor}">
      </div>

      <div class="activity-text">
        ${escapeHTML(text)}
      </div>
    `;


    activity.insertBefore(
      row,
      activity.firstChild
    );


    while(activity.children.length > 8){

      activity.removeChild(
        activity.lastChild
      );

    }

  }


  function setLoading(state){

    const bar = el("loadingBar");

    if(bar){
      bar.classList.toggle("show",state);
    }

  }


  function wait(ms){

    return new Promise(function(resolve){

      setTimeout(resolve,ms);

    });

  }


  function formatDate(value){

    if(!value){
      return "Unknown time";
    }


    const date = new Date(value);


    if(Number.isNaN(date.getTime())){
      return "Unknown time";
    }


    return date.toLocaleString("en-IN",{
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });

  }


  /* ==========================================================
     AI NORMALIZATION
  ========================================================== */

  function getAI(article){

    if(
      article &&
      article.ai &&
      typeof article.ai === "object"
    ){
      return article.ai;
    }

    return {};

  }


  function getScore(article){

    const ai = getAI(article);

    const score = Number(ai.trendScore);


    if(Number.isFinite(score)){

      return Math.max(
        0,
        Math.min(
          100,
          Math.round(score)
        )
      );

    }


    return 0;

  }


  function getCategory(article){

    const ai = getAI(article);


    const category = String(
      ai.category ||
      "OTHER"
    ).toUpperCase().trim();


    const allowed = [
      "BUSINESS",
      "TECHNOLOGY",
      "POLITICS",
      "SPORTS",
      "SCIENCE",
      "ENTERTAINMENT",
      "OTHER"
    ];


    if(allowed.includes(category)){
      return category;
    }


    return "OTHER";

  }


  function getPriority(article){

    const ai = getAI(article);


    return String(
      ai.priority ||
      "NORMAL"
    ).toUpperCase();

  }


  function getAttention(article){

    const ai = getAI(article);


    const raw = String(
      ai.attentionPotential ||
      "UNKNOWN"
    ).toUpperCase();


    if(
      raw === "TRUE" ||
      raw === "HIGH" ||
      raw === "VERY_HIGH"
    ){
      return "HIGH";
    }


    if(
      raw === "FALSE" ||
      raw === "LOW"
    ){
      return "NORMAL";
    }


    return raw;

  }


  function needsReview(article){

    const ai = getAI(article);

    return Boolean(
      ai.humanVerificationRequired
    );

  }


  function getReason(article){

    const ai = getAI(article);


    return ai.reasoning ||
      "AI analysis did not provide additional reasoning.";

  }


  /* ==========================================================
     DISCOVERY
  ========================================================== */

  async function discoverNews(){

    if(isDiscovering){
      return;
    }


    isDiscovering = true;


    const button = el("discoverBtn");


    if(button){

      button.disabled = true;

      button.textContent =
        "SCANNING INTELLIGENCE...";

    }


    el("engineStatus").textContent =
      "Connecting to NEWSFORGE news engine...";


    setLoading(true);


    addActivity(
      "Discovery command received. Connecting to /api/news."
    );


    resetPipeline();


    try{

      const response = await fetch(
        "/api/news?pageSize=20",
        {
          method:"GET",

          headers:{
            "Accept":"application/json"
          },

          cache:"no-store"
        }
      );


      const rawText =
        await response.text();


      let data = null;


      try{

        data =
          rawText
            ? JSON.parse(rawText)
            : null;

      }catch(parseError){

        throw new Error(
          "Backend returned invalid JSON."
        );

      }


      if(!response.ok){

        const message =
          data &&
          (
            data.message ||
            data.error ||
            data.details
          );


        throw new Error(
          message ||
          "News engine returned HTTP " +
          response.status
        );

      }


      if(!data){

        throw new Error(
          "News engine returned an empty response."
        );

      }


      if(data.status === "error"){

        throw new Error(
          data.message ||
          "NEWSFORGE backend reported an error."
        );

      }


      allArticles =
        Array.isArray(data.articles)
          ? data.articles
          : [];


      if(allArticles.length === 0){

        renderNews();

        updateMetrics(data);


        el("engineStatus").textContent =
          "Engine connected, but no stories were returned.";


        el("summaryTitle").textContent =
          "No stories detected";


        el("summaryText").textContent =
          "The backend responded successfully, but the news provider returned no usable articles for this request.";


        addActivity(
          "Backend connected successfully, but returned zero stories.",
          "warn"
        );


        showToast(
          "No stories",
          "The news engine responded, but there were no articles to display."
        );


        return;

      }


      renderNews();

      updateMetrics(data);

      updateSummary(data);

      markDiscoveryComplete();


      addActivity(
        "Discovery completed. " +
        allArticles.length +
        " stories received from the news engine."
      );


      if(
        data.ai &&
        data.ai.enabled
      ){

        addActivity(
          "Gemini intelligence analysis completed for " +
          (
            data.ai.analyzedStories ||
            data.ai.analyzed ||
            allArticles.length
          ) +
          " stories."
        );

      }else{

        addActivity(
          "News received without AI analysis.",
          "warn"
        );

      }


      showToast(
        "Discovery complete",
        allArticles.length +
        " stories analyzed by NEWSFORGE."
      );


    }catch(error){

      console.error(
        "NEWSFORGE discovery error:",
        error
      );


      allArticles = [];


      renderError(
        error && error.message
          ? error.message
          : "Unknown discovery error."
      );


      el("engineStatus").textContent =
        "Discovery failed.";


      el("summaryTitle").textContent =
        "News engine error";


      el("summaryText").textContent =
        error && error.message
          ? error.message
          : "Unable to connect to the NEWSFORGE backend.";


      addActivity(
        "Discovery failed: " +
        (
          error && error.message
            ? error.message
            : "Unknown error"
        ),
        "error"
      );


      showToast(
        "Discovery failed",
        error && error.message
          ? error.message
          : "Unable to connect to backend."
      );


    }finally{

      isDiscovering = false;

      setLoading(false);


      if(button){

        button.disabled = false;

        button.textContent =
          "DISCOVER TRENDING NEWS";

      }

    }

  }


  /* ==========================================================
     NEWS RENDER
  ========================================================== */

  function renderNews(){

    const grid = el("newsGrid");


    if(!grid){
      return;
    }


    let visible =
      allArticles.slice();


    if(currentCategory !== "ALL"){

      visible =
        visible.filter(function(article){

          return (
            getCategory(article) ===
            currentCategory
          );

        });

    }


    visible.sort(function(a,b){

      return getScore(b) -
        getScore(a);

    });


    if(visible.length === 0){

      grid.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            ⌁
          </div>

          <div class="empty-title">
            No matching stories
          </div>

          <div class="empty-text">
            No discovered stories match the selected intelligence category.
          </div>

        </div>
      `;

      return;

    }


    grid.innerHTML =
      visible
        .map(function(article,index){

          return createNewsCard(
            article,
            index
          );

        })
        .join("");

  }


  function renderError(message){

    const grid =
      el("newsGrid");


    if(!grid){
      return;
    }


    grid.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          !
        </div>

        <div class="empty-title">
          NEWS ENGINE ERROR
        </div>

        <div class="empty-text">
          ${escapeHTML(message)}
        </div>

        <button
          class="btn btn-primary"
          style="margin-top:18px"
          onclick="window.discoverNews()">
          RETRY DISCOVERY
        </button>

      </div>
    `;

  }


  function createNewsCard(article,index){

    const score =
      getScore(article);


    const category =
      getCategory(article);


    const priority =
      getPriority(article);


    const attention =
      getAttention(article);


    const review =
      needsReview(article);


    const reason =
      getReason(article);


    const title =
      article.title ||
      "Untitled story";


    const description =
      article.description ||
      "No description supplied by source.";


    const source =
      article.source ||
      "Unknown source";


    const url =
      article.url ||
      "#";


    const articleIndex =
      allArticles.indexOf(article);


    let scoreClass = "";


    if(score >= 80){

      scoreClass =
        "critical";

    }else if(score >= 70){

      scoreClass =
        "hot";

    }


    const priorityClass =
      priority === "CRITICAL"
        ? "critical"
        : priority === "HIGH"
          ? "hot"
          : "";


    const reviewClass =
      review
        ? "review"
        : "";


    return `
      <article class="news-card">

        <div class="news-top">

          <div class="source">
            ${escapeHTML(source)}
          </div>

          <div class="news-time">
            ${escapeHTML(
              formatDate(article.publishedAt)
            )}
          </div>

        </div>


        <div class="news-title">
          ${escapeHTML(title)}
        </div>


        <div class="news-description">
          ${escapeHTML(
            truncate(description,240)
          )}
        </div>


        <div class="ai-row">

          <div class="ai-badge ${scoreClass}">
            TREND ${score}
          </div>

          <div class="ai-badge">
            ${escapeHTML(category)}
          </div>

          <div class="ai-badge ${priorityClass}">
            ${escapeHTML(priority)}
          </div>

          <div class="ai-badge">
            ATTENTION ${escapeHTML(attention)}
          </div>

          ${
            review
              ? `
                <div class="ai-badge ${reviewClass}">
                  HUMAN REVIEW
                </div>
              `
              : ""
          }

        </div>


        <div class="ai-reason">

          <div class="ai-reason-label">
            AI REASONING
          </div>

          <div class="ai-reason-text">
            ${escapeHTML(
              truncate(reason,260)
            )}
          </div>

        </div>


        <div class="news-footer">

          <div class="news-footer-left">

            ${
              review
                ? `
                  <span class="badge">
                    APPROVAL REQUIRED
                  </span>
                `
                : `
                  <span class="badge">
                    AI ANALYZED
                  </span>
                `
            }


            <button
              class="research-btn"
              onclick="window.openResearch(${articleIndex})">
              RESEARCH STORY
            </button>

          </div>


          ${
            url && url !== "#"
              ? `
                <a
                  class="open-source"
                  href="${escapeHTML(url)}"
                  target="_blank"
                  rel="noopener noreferrer">
                  OPEN SOURCE ↗
                </a>
              `
              : `
                <span class="open-source">
                  SOURCE UNAVAILABLE
                </span>
              `
          }

        </div>

      </article>
    `;

  }


  /* ==========================================================
     METRICS
  ========================================================== */

  function updateMetrics(data){

    const total =
      allArticles.length;


    const high =
      allArticles.filter(function(article){

        return getScore(article) >= 70;

      }).length;


    const review =
      allArticles.filter(function(article){

        return needsReview(article);

      }).length;


    el("metricStories").textContent =
      total;


    el("metricStoriesSub").textContent =
      total
        ? "India · " + total + " stories"
        : "Awaiting discovery";


    el("metricPotential").textContent =
      high;


    el("metricContent").textContent =
      contentGenerated;


    if(total > 0){

      el("metricVerification").textContent =
        Math.round(
          (review / total) * 100
        ) + "%";


      el("metricVerificationSub").textContent =
        review +
        " stories flagged for human review";

    }else{

      el("metricVerification").textContent =
        "--";


      el("metricVerificationSub").textContent =
        "Human approval required";

    }


    if(
      data &&
      data.ai &&
      typeof data.ai.highPotential ===
      "number"
    ){

      el("metricPotential").textContent =
        data.ai.highPotential;

    }

  }


  /* ==========================================================
     SUMMARY
  ========================================================== */

  function updateSummary(data){

    const total =
      allArticles.length;


    const high =
      allArticles.filter(function(article){

        return getScore(article) >= 70;

      }).length;


    const critical =
      allArticles.filter(function(article){

        return getScore(article) >= 85;

      }).length;


    const review =
      allArticles.filter(function(article){

        return needsReview(article);

      }).length;


    el("summaryAnalyzed").textContent =
      total;


    el("summaryHigh").textContent =
      high;


    el("summaryCritical").textContent =
      critical;


    el("summaryReview").textContent =
      review;


    const top =
      allArticles
        .slice()
        .sort(function(a,b){

          return getScore(b) -
            getScore(a);

        })[0];


    if(!top){

      el("summaryTitle").textContent =
        "Waiting for discovery";


      el("summaryText").textContent =
        "No stories are currently available for AI analysis.";


      return;

    }


    el("summaryTitle").textContent =
      "Top signal: " +
      truncate(
        top.title ||
        "Untitled story",
        90
      );


    let summary = [

      "NEWSFORGE analyzed " +
      total +
      " discovered stories.",

      high +
      " stories currently have high attention potential.",

      review +
      " stories require human verification before downstream publishing."

    ];


    if(
      data &&
      data.ai &&
      data.ai.provider
    ){

      summary.push(
        "Analysis provider: " +
        data.ai.provider +
        "."
      );

    }


    el("summaryText").textContent =
      summary.join(" ");

  }


  /* ==========================================================
     CATEGORY
  ========================================================== */

  function setCategory(category){

    currentCategory =
      String(
        category ||
        "ALL"
      ).toUpperCase();


    document
      .querySelectorAll(".filter")
      .forEach(function(button){

        button.classList.toggle(
          "active",
          button.dataset.category ===
          currentCategory
        );

      });


    renderNews();

  }


  /* ==========================================================
     PIPELINE
  ========================================================== */

  function resetPipeline(){

    const steps = [
      "step1",
      "step2",
      "step3",
      "step4",
      "step5"
    ];


    steps.forEach(function(id){

      const node =
        el(id);


      if(node){

        node.classList.remove(
          "active",
          "done"
        );

      }

    });


    el("step1Status").textContent =
      "READY";


    el("step2Status").textContent =
      "WAITING";


    el("step3Status").textContent =
      "WAITING";


    el("step4Status").textContent =
      "NOT ACTIVE";


    el("step5Status").textContent =
      "PAUSED";

  }


  function markDiscoveryComplete(){

    el("step1").classList.add("done");

    el("step1Status").textContent =
      "COMPLETE";


    el("step2").classList.add("done");

    el("step2Status").textContent =
      "COMPLETE";


    el("step3").classList.add("active");

    el("step3Status").textContent =
      "REVIEW FLAGS READY";


    el("engineStatus").textContent =
      "AI intelligence ready for research.";

  }


  async function runPipeline(){

    if(allArticles.length === 0){

      showToast(
        "Nothing to process",
        "Run discovery first so the AI pipeline has actual stories to analyze."
      );


      await discoverNews();


      if(allArticles.length === 0){
        return;
      }

    }


    const button =
      el("pipelineBtn");


    if(button){

      button.disabled = true;

      button.textContent =
        "RUNNING PIPELINE...";

    }


    resetPipeline();


    addActivity(
      "AI pipeline started."
    );


    el("step1").classList.add("active");

    el("step1Status").textContent =
      "PROCESSING";


    await wait(500);


    el("step1").classList.remove("active");

    el("step1").classList.add("done");

    el("step1Status").textContent =
      "COMPLETE";


    el("step2").classList.add("active");

    el("step2Status").textContent =
      "ANALYZING";


    addActivity(
      "Preparing discovered stories for research."
    );


    await wait(700);


    el("step2").classList.remove("active");

    el("step2").classList.add("done");

    el("step2Status").textContent =
      "READY";


    el("step3").classList.add("active");

    el("step3Status").textContent =
      "VERIFY FLAGS";


    await wait(600);


    const reviewCount =
      allArticles.filter(function(article){

        return needsReview(article);

      }).length;


    el("step3").classList.remove("active");

    el("step3").classList.add("done");


    el("step3Status").textContent =
      reviewCount +
      " FLAGGED";


    addActivity(
      reviewCount +
      " stories require human verification."
    );


    el("step4").classList.add("active");

    el("step4Status").textContent =
      "WAITING FOR APPROVAL";


    addActivity(
      "Content generation remains locked until approval."
    );


    await wait(700);


    el("step4").classList.remove("active");


    el("step5").classList.add("active");

    el("step5Status").textContent =
      "PAUSED";


    await wait(500);


    el("step5").classList.remove("active");


    if(button){

      button.disabled = false;

      button.textContent =
        "RUN AI PIPELINE";

    }


    showToast(
      "Pipeline complete",
      "Discovery and intelligence analysis completed. Research is available per story."
    );

  }


  /* ==========================================================
     RESEARCH WORKSPACE
  ========================================================== */

  function openResearch(index){

    const article =
      allArticles[index];


    if(!article){

      showToast(
        "Research unavailable",
        "The selected story could not be found."
      );

      return;

    }


    selectedArticle =
      article;


    isResearchOpen = true;


    populateResearch(article);


    const overlay =
      el("researchOverlay");


    if(overlay){

      overlay.classList.add("open");

    }


    document.body.classList.add(
      "modal-open"
    );


    addActivity(
      "Research workspace opened for: " +
      truncate(
        article.title ||
        "selected story",
        90
      ),
      "research"
    );

  }


  function populateResearch(article){

    const score =
      getScore(article);


    const category =
      getCategory(article);


    const priority =
      getPriority(article);


    const attention =
      getAttention(article);


    const review =
      needsReview(article);


    const reason =
      getReason(article);


    const source =
      article.source ||
      "Unknown source";


    const url =
      article.url ||
      "#";


    const description =
      article.description ||
      "No description supplied by source.";


    el("researchTitle").textContent =
      article.title ||
      "Untitled story";


    el("researchDescription").textContent =
      description;


    el("researchSource").textContent =
      source;


    el("researchPublished").textContent =
      formatDate(
        article.publishedAt
      );


    el("researchTrend").textContent =
      score + "/100";


    el("researchCategory").textContent =
      category;


    el("researchPriority").textContent =
      priority;


    el("researchReasoning").textContent =
      reason;


    el("researchAttention").textContent =
      attention;


    el("researchReview").textContent =
      review
        ? "REQUIRED"
        : "NOT FLAGGED";


    el("researchSourceName").textContent =
      source;


    el("researchSourceUrl").textContent =
      url === "#"
        ? "No source URL available"
        : url;


    const openSource =
      el("researchOpenSource");


    const bottomSource =
      el("researchBottomSource");


    if(url !== "#"){

      openSource.href = url;

      openSource.style.display =
        "block";


      bottomSource.href = url;

      bottomSource.style.display =
        "inline-flex";

    }else{

      openSource.removeAttribute(
        "href"
      );

      openSource.style.display =
        "none";


      bottomSource.style.display =
        "none";

    }


    /*
      Before real research begins, this is only the
      AI intelligence signal. It is NOT verification.
    */

    let confidence = 0;


    if(score > 0){

      confidence =
        Math.max(
          20,
          Math.min(
            95,
            Math.round(
              score * .72
            )
          )
        );

    }


    if(review){

      confidence =
        Math.min(
          confidence,
          65
        );

    }


    el("researchConfidence").textContent =
      confidence
        ? confidence + "%"
        : "--";


    if(review){

      el("researchStatusBig").textContent =
        "HUMAN REVIEW";


      el("researchStatusSmall").textContent =
        "AI analysis indicates that this story should not proceed downstream without human verification.";


      el("researchVerificationLabel").textContent =
        "REVIEW REQUIRED";

    }else{

      el("researchStatusBig").textContent =
        "NOT YET VERIFIED";


      el("researchStatusSmall").textContent =
        "No independent verification has been performed by the NEWSFORGE research engine yet.";


      el("researchVerificationLabel").textContent =
        "PENDING RESEARCH";

    }


    resetResearchUI();

  }


  function resetResearchUI(){

    const claimList =
      el("claimList");


    claimList.innerHTML = "";

    claimList.style.display =
      "none";


    const placeholder =
      document.querySelector(
        ".research-placeholder"
      );


    if(placeholder){

      placeholder.style.display =
        "flex";

    }


    el("researchVerificationLabel").textContent =
      "PENDING RESEARCH";


    const statusBig =
      el("researchStatusBig");


    const statusSmall =
      el("researchStatusSmall");


    if(statusBig){
      statusBig.textContent =
        "NOT YET VERIFIED";
    }


    if(statusSmall){
      statusSmall.textContent =
        "No independent verification has been performed by the NEWSFORGE research engine yet.";
    }


    const confidence =
      el("researchConfidence");


    if(confidence){
      confidence.textContent =
        "--";
    }

  }


  /* ==========================================================
     REAL AI RESEARCH
  ========================================================== */

  async function startResearch(){

    if(isResearching){
      return;
    }


    if(!selectedArticle){

      showToast(
        "No story selected",
        "Open a story before starting research."
      );

      return;

    }


    isResearching = true;


    const button =
      document.querySelector(
        ".research-actions .btn-primary"
      );


    if(button){

      button.disabled = true;

      button.textContent =
        "RESEARCHING WEB...";

    }


    setLoading(true);


    const title =
      selectedArticle.title ||
      "selected story";


    addActivity(
      "AI research started: " +
      truncate(title,90),
      "research"
    );


    el("researchVerificationLabel").textContent =
      "SEARCHING";


    el("researchStatusBig").textContent =
      "RESEARCHING";


    el("researchStatusSmall").textContent =
      "NEWSFORGE is asking Gemini to investigate the story using current web information and independent sources.";


    el("researchConfidence").textContent =
      "...";


    const placeholder =
      document.querySelector(
        ".research-placeholder"
      );


    if(placeholder){

      placeholder.innerHTML = `
        <div class="research-placeholder-icon">
          ◌
        </div>

        <div class="research-placeholder-title">
          SEARCHING THE WEB
        </div>

        <div class="research-placeholder-text">
          Gemini is searching for current reporting,
          supporting evidence and conflicting information.
        </div>
      `;

    }


    try{

      const response =
        await fetch(
          "/api/research",
          {
            method:"POST",

            headers:{
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:JSON.stringify({
              article:selectedArticle
            }),

            cache:"no-store"
          }
        );


      const rawText =
        await response.text();


      let data = null;


      try{

        data =
          rawText
            ? JSON.parse(rawText)
            : null;

      }catch(error){

        throw new Error(
          "Research backend returned invalid JSON."
        );

      }


      if(!response.ok){

        throw new Error(
          (
            data &&
            (
              data.message ||
              data.error ||
              data.details
            )
          ) ||
          "Research engine returned HTTP " +
          response.status
        );

      }


      if(
        !data ||
        data.status !== "success" ||
        !data.research
      ){

        throw new Error(
          "Research engine returned an incomplete response."
        );

      }


      renderResearchResults(
        data.research
      );


      addActivity(
        "AI research completed: " +
        truncate(title,90),
        "research"
      );


      showToast(
        "Research complete",
        "NEWSFORGE finished the web-based research analysis."
      );


    }catch(error){

      console.error(
        "NEWSFORGE research error:",
        error
      );


      renderResearchError(
        error && error.message
          ? error.message
          : "Unknown research error."
      );


      addActivity(
        "Research failed: " +
        (
          error && error.message
            ? error.message
            : "Unknown error"
        ),
        "error"
      );


      showToast(
        "Research failed",
        error && error.message
          ? error.message
          : "Unable to complete research."
      );


    }finally{

      isResearching = false;

      setLoading(false);


      if(button){

        button.disabled = false;

        button.textContent =
          "RUN AI RESEARCH";

      }

    }

  }


  /* ==========================================================
     RESEARCH RESULT RENDERING
  ========================================================== */

  function renderResearchResults(research){

    const status =
      String(
        research.research_status ||
        "REVIEW"
      ).toUpperCase();


    const confidence =
      Number(
        research.confidence
      );


    const safeConfidence =
      Number.isFinite(confidence)
        ? Math.max(
            0,
            Math.min(
              100,
              Math.round(confidence)
            )
          )
        : 0;


    el("researchVerificationLabel").textContent =
      status;


    el("researchStatusBig").textContent =
      status.replace(
        /_/g,
        " "
      );


    el("researchConfidence").textContent =
      safeConfidence +
      "%";


    let statusExplanation =
      research.executive_summary ||
      "Research completed."


    if(status === "VERIFIED"){

      statusExplanation =
        "The searched evidence strongly supports the core claim, but editorial review should still consider the context and source quality.";

    }


    if(status === "REVIEW"){

      statusExplanation =
        "Evidence was found, but human review is recommended before the story is treated as publication-ready.";

    }


    if(status === "UNVERIFIED"){

      statusExplanation =
        "The available searched evidence was not sufficient to establish the core claim.";

    }


    if(status === "CONFLICTED"){

      statusExplanation =
        "Credible sources contain material disagreement. Human investigation is required.";

    }


    el("researchStatusSmall").textContent =
      statusExplanation;


    /*
      Replace AI signal reasoning with the actual
      research executive summary.
    */

    el("researchReasoning").textContent =
      research.executive_summary ||
      "No executive summary returned.";


    el("researchAttention").textContent =
      "RESEARCHED";


    el("researchReview").textContent =
      (
        status === "VERIFIED"
      )
        ? "RECOMMENDED"
        : "REQUIRED";


    /* --------------------------------------------------------
       CLAIMS
    -------------------------------------------------------- */

    renderClaims(
      Array.isArray(
        research.key_claims
      )
        ? research.key_claims
        : []
    );


    /* --------------------------------------------------------
       SOURCES
    -------------------------------------------------------- */

    renderResearchSources(
      Array.isArray(
        research.sources
      )
        ? research.sources
        : []
    );


    /* --------------------------------------------------------
       Replace roadmap placeholder with result summary
    -------------------------------------------------------- */

    const placeholder =
      document.querySelector(
        ".research-placeholder"
      );


    if(placeholder){

      placeholder.innerHTML = `
        <div class="research-placeholder-icon">
          ✓
        </div>

        <div class="research-placeholder-title">
          RESEARCH COMPLETE
        </div>

        <div class="research-placeholder-text">
          ${escapeHTML(
            research.cross_check_summary ||
            "Cross-check analysis completed."
          )}
        </div>
      `;

    }


    /*
      Add evidence and risk information into the
      existing research note.
    */

    const note =
      document.querySelector(
        ".research-note"
      );


    if(note){

      const supporting =
        Array.isArray(
          research.supporting_evidence
        )
          ? research.supporting_evidence
          : [];


      const conflicting =
        Array.isArray(
          research.conflicting_evidence
        )
          ? research.conflicting_evidence
          : [];


      const risks =
        Array.isArray(
          research.risk_flags
        )
          ? research.risk_flags
          : [];


      note.innerHTML = `
        <strong>AI RESEARCH RESULT:</strong>
        ${escapeHTML(
          research.recommendation ||
          "Human review is recommended before publication."
        )}

        ${
          supporting.length
            ? `
              <br><br>
              <strong>SUPPORTING EVIDENCE:</strong>
              ${escapeHTML(
                supporting.join(" • ")
              )}
            `
            : ""
        }

        ${
          conflicting.length
            ? `
              <br><br>
              <strong>CONFLICTING EVIDENCE:</strong>
              ${escapeHTML(
                conflicting.join(" • ")
              )}
            `
            : ""
        }

        ${
          risks.length
            ? `
              <br><br>
              <strong>RISK FLAGS:</strong>
              ${escapeHTML(
                risks.join(" • ")
              )}
            `
            : ""
        }
      `;

    }

  }


  function renderClaims(claims){

    const list =
      el("claimList");


    if(!list){
      return;
    }


    if(!claims.length){

      list.style.display =
        "none";

      return;

    }


    list.innerHTML =
      claims
        .map(function(item){

          const assessment =
            String(
              item.assessment ||
              "REVIEW"
            ).toUpperCase();


          let icon =
            "•";


          if(
            assessment ===
            "SUPPORTED"
          ){

            icon = "✓";

          }


          if(
            assessment ===
            "UNSUPPORTED"
          ){

            icon = "×";

          }


          if(
            assessment ===
            "CONFLICTED"
          ){

            icon = "!";

          }


          if(
            assessment ===
            "PARTIALLY_SUPPORTED"
          ){

            icon = "≈";

          }


          return `
            <div class="claim">

              <div class="claim-icon">
                ${icon}
              </div>

              <div class="claim-text">

                <strong>
                  ${escapeHTML(
                    assessment.replace(
                      /_/g,
                      " "
                    )
                  )}
                </strong>

                <br>

                ${escapeHTML(
                  item.claim ||
                  "Claim unavailable."
                )}

                ${
                  item.explanation
                    ? `
                      <br><br>
                      ${escapeHTML(
                        item.explanation
                      )}
                    `
                    : ""
                }

              </div>

            </div>
          `;

        })
        .join("");


    list.style.display =
      "grid";

  }


  function renderResearchSources(sources){

    const container =
      document.querySelector(
        ".source-preview"
      );


    if(!container){
      return;
    }


    if(!sources.length){

      return;

    }


    const sourceInfo =
      container.querySelector(
        ".source-preview-info"
      );


    if(!sourceInfo){
      return;
    }


    const first =
      sources[0];


    const sourceName =
      sourceInfo.querySelector(
        ".source-preview-name"
      );


    const sourceUrl =
      sourceInfo.querySelector(
        ".source-preview-url"
      );


    const link =
      container.querySelector(
        "a"
      );


    if(sourceName){

      sourceName.textContent =
        first.title ||
        "Research source";

    }


    if(sourceUrl){

      sourceUrl.textContent =
        first.url ||
        "Source URL unavailable";

    }


    if(link && first.url){

      link.href =
        first.url;

      link.textContent =
        "OPEN ↗";

    }


    /*
      Add additional source cards after
      the primary source preview.
    */

    let existing =
      document.getElementById(
        "researchSourcesExtra"
      );


    if(existing){

      existing.remove();

    }


    if(sources.length <= 1){

      return;

    }


    existing =
      document.createElement(
        "div"
      );


    existing.id =
      "researchSourcesExtra";


    existing.style.marginTop =
      "12px";


    existing.innerHTML =
      sources
        .slice(1,8)
        .map(function(source){

          if(!source || !source.url){
            return "";
          }


          return `
            <div class="source-preview">

              <div class="source-preview-info">

                <div class="source-preview-name">
                  ${escapeHTML(
                    source.title ||
                    "Research source"
                  )}
                </div>

                <div class="source-preview-url">
                  ${escapeHTML(
                    source.url
                  )}
                </div>

              </div>

              <a
                href="${escapeHTML(source.url)}"
                target="_blank"
                rel="noopener noreferrer">
                OPEN ↗
              </a>

            </div>
          `;

        })
        .join("");


    /*
      Put extra sources directly after
      the source preview card.
    */

    const parent =
      container.parentElement;


    if(parent){

      parent.appendChild(
        existing
      );

    }

  }


  function renderResearchError(message){

    el("researchVerificationLabel").textContent =
      "ERROR";


    el("researchStatusBig").textContent =
      "RESEARCH FAILED";


    el("researchStatusSmall").textContent =
      message;


    el("researchConfidence").textContent =
      "--";


    const placeholder =
      document.querySelector(
        ".research-placeholder"
      );


    if(placeholder){

      placeholder.innerHTML = `
        <div class="research-placeholder-icon">
          !
        </div>

        <div class="research-placeholder-title">
          RESEARCH ENGINE ERROR
        </div>

        <div class="research-placeholder-text">
          ${escapeHTML(message)}
        </div>
      `;

    }

  }


  /* ==========================================================
     CLOSE RESEARCH
  ========================================================== */

  function closeResearch(){

    if(isResearching){

      showToast(
        "Research in progress",
        "Please wait for the current research request to finish."
      );

      return;

    }


    const overlay =
      el("researchOverlay");


    if(overlay){

      overlay.classList.remove(
        "open"
      );

    }


    document.body.classList.remove(
      "modal-open"
    );


    isResearchOpen = false;

    selectedArticle = null;

  }


  function handleResearchBackdrop(event){

    if(
      event.target ===
      el("researchOverlay")
    ){

      closeResearch();

    }

  }


  /* ==========================================================
     KEYBOARD
  ========================================================== */

  document.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape" &&
        isResearchOpen
      ){

        closeResearch();

      }

    }
  );


  /* ==========================================================
     PUBLIC API
  ========================================================== */

  window.discoverNews =
    discoverNews;


  window.runPipeline =
    runPipeline;


  window.setCategory =
    setCategory;


  window.openResearch =
    openResearch;


  window.closeResearch =
    closeResearch;


  window.handleResearchBackdrop =
    handleResearchBackdrop;


  /*
    IMPORTANT:
    The HTML button still calls prepareResearchStage().
    We intentionally redirect it to the real research engine.
  */

  window.prepareResearchStage =
    startResearch;


  /* ==========================================================
     INITIAL STATE
  ========================================================== */

  addActivity(
    "Frontend intelligence interface loaded."
  );


  addActivity(
    "NEWSFORGE backend endpoint configured at /api/news."
  );


  addActivity(
    "AI research endpoint configured at /api/research."
  );


  addActivity(
    "Story research workspace initialized."
  );


})();

</script>
